<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            width: 100%;
        }
        .sub{
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;

        }
        .con{
            width: 23%;
            height: 60vh;
            /* border: 0.1px solid black; */
            border-radius: 12px;
               box-shadow: -2px -2px 11px -8px black;
               margin-bottom: 22px;
               background-color: antiquewhite;

        }
        @media (max-width:786px) {
            .sub{
                flex-direction: column;
                width: 47%;
            }
            .con{
                width: 100%;

            }
            .main{
                display: flex;
                justify-content: space-around;
                align-items: center;
            }
            
        }

        @media (max-width:500px) {
            .main{
                flex-direction: column;
            }
            .sub{
                width: 100%;
            }
        }
    </style>
</head>
