<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Your Next Planner Tours | Guided Trips & Itineraries</title>
    <meta name="description" content="Plan your next trip with Your Next Planner Tours. Explore expertly designed itineraries, guided tours, and hassle-free trip planning. Book your next adventure today." />
    <meta name="keywords" content="next planner tour, guided tours, trip planning, itinerary, travel planner" />

    <!-- Canonical (set this to your real domain) -->
    <link rel="canonical" href="https://YOUR_SITE_URL/" />

    <!-- Robots -->
    <meta name="robots" content="index,follow" />

    <!-- Open Graph (Facebook/LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Your Next Planner Tours" />
    <meta property="og:title" content="Your Next Planner Tours | Guided Trips & Itineraries" />
    <meta property="og:description" content="Plan your next trip with expert itineraries, guided experiences, and easy booking." />
    <meta property="og:url" content="https://YOUR_SITE_URL/" />
    <!-- Recommended: put your real image URL -->
    <meta property="og:image" content="https://YOUR_SITE_URL/og-image.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Your Next Planner Tours | Guided Trips & Itineraries" />
    <meta name="twitter:description" content="Plan your next trip with expert itineraries, guided experiences, and easy booking." />
    <meta name="twitter:image" content="https://YOUR_SITE_URL/og-image.jpg" />

    <!-- Structured Data (LocalBusiness / Travel-related) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "TravelAgency",
        "name": "Your Next Planner Tours",
        "url": "https://YOUR_SITE_URL/",
        "description": "Plan your next trip with expert itineraries and guided tour experiences.",
        "telephone": "+1-000-000-0000",
        "sameAs": [
          "https://facebook.com/YOUR_PAGE",
          "https://instagram.com/YOUR_PAGE",
          "https://linkedin.com/company/YOUR_COMPANY"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
