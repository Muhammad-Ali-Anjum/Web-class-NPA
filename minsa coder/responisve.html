<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            width: 100%;
            height: 100vh;
        }
        .sub{
            width:100%;
            height: 50vh;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .con{
            width: 23%;
            height: 90%;
            box-shadow: inset 0 0 3px #000000;
            background-color: antiquewhite;
            /* background-color: rgb(66, 8, 8); */
            /* border: 1px solid black; */
            border-radius: 12px;
        /* padding-left: 12px; */
        padding:10px 0 0 12px;
            
        }
        @media (max-width:1100px) {
            .main{
                display: flex;
                justify-content: space-around;
                align-items: center;
            }
            .sub{
                flex-direction: column;
                width: 47%;
                height: 200vh;
            }
            .con{
                width: 100%;
                margin-top: 12px;
                height: 100vh;
            }
            
        }
        @media (max-width:605px) {
            .main{
                flex-direction: column;

            }
            .sub{
                width: 100%;

            }
            
        }
    </style>
</head>
<body>
    <h1>My Responsive Page</h1>
    <div class="main">
        <div class="sub">
            <div class="con">cont</div>
            <div class="con">cont</div>
            <div class="con">cont</div>
            <div class="con">cont</div>
        </div>
        <div class="sub">
            <div class="con">cont</div>
            <div class="con">cont</div>
            <div class="con">cont</div>
            <div class="con">cont</div>
        </div>

    </div>
</body>
</html>
