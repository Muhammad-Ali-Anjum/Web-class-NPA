<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Responsive */
        .main , .main1{
            width: 100%;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            margin-top: 12px;
        }
        .sub{
            width: 23%;
            height: 60vh;
            border: 1px solid black;
            border-radius: 12px;
        }
        @media (max-width:1100px) {
            .main, .main1{
                width: 47%;
                flex-direction: column;

            }
            .sub{
                width: 90%;
                height: 50vh;
                margin-bottom: 42px;
            }
            .product{
                width: 100%;
                display: flex;
                justify-content: space-around;
                align-items: center;
            }

            
        }
        @media (max-width:700px) {
            .product{
                flex-direction: column;
            }
            .main , .main1{
                width: 90%;
            }
            
        }
    </style>
</head>
<body>
    <div class="product">
        <div class="main">
        <div class="sub"></div>
        <div class="sub"></div>
        <div class="sub"></div>
        <div class="sub"></div>
    </div>
    <div class="main1">
        <div class="sub"></div>
        <div class="sub"></div>
        <div class="sub"></div>
        <div class="sub"></div>
    </div>
    </div>
</body>
</html>
