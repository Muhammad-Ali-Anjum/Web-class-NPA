<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   
</head>
<style>
    .main{
        width: 100px;
        height: 100px;
        background-color: blanchedalmond;
        /* animation: name duration timing-function delay iteration-count direction fill-mode; */
        animation: move 2s  infinite alternate;
        position: relative;
    }
    @keyframes move {
       0%{
        top: 0px;
        left: 0px;

       }
       25%{
        top: 0px;
        left: 200px;
        background-color: aqua;
       }
       50%{
        top: 200px;
        left: 200px;
        background-color: bisque;
       }
       75%{
        top: 200px;
        left: 0px;
        background-color: yellow;
       }
       100%{
        top: 0px;
        left: 0px;

       }

    }
    .main1{
        position: fixed;
        bottom: 0px;
        z-index: 1;
        animation: moves 2s infinite alternate;

    }
    @keyframes moves {
        0%{
            left: 0px;
        }
        50%{
            left: 30px;
        }
         100%{
            left: 0px;
        }
    }
.main1 img{
width: 50px;
}
</style>
<body>
    <div class="main"></div>
    <div class="main1"><img src="../img/arrow icon.png" alt=""></div>
</body>
</html>
