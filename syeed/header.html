<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            overflow: hidden;
        }
        .main{
            width: 100%;
            height: 13vh;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            background-color: bisque;
            /* box-shadow: 0px 0px 4px 12px black; */
        }
        .log{
            width: 30%;
            font-size: 14px;

            text-align: center;
        }
        .primaryheader{
            width: 50%;

        }
        .primaryheader ul{
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }
        .primaryheader li{
            list-style-type: none;
        }
        .primaryheader ul li a{
            text-decoration: none;
            font-size: 18px;
            color: black;
        }
        .search{
            width: 18%;
        }
        .search input{
            width: 90%;
            height: 5vh;
            border: none;
            border-radius: 5px;
        }
        .hero{
            width: 100%;
            height: 100vh;
            background-image: url(../img/carousel-1.jpg);
            background-size: 100% 100vh;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 1000px;
        }
    </style>
</head>
<body>
    
    <div class="main">
        <div class="log"><h1>logo</h1></div>
        <div class="primaryheader">
            <ul>
                <li><a href="#">Home</a>

                
                </li>

                <li><a href="#">About</a></li>
                <li><a href="#">Service</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </div>
        <div class="search"><input type="search" name="" id="" placeholder="Searching............"></div>
    </div>

    <!-- hero section -->
     <div class="hero">
        <h1>welcome to over page</h1>
     </div>
</body>
</html>
