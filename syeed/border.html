<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            width: 100%;
            height: 100vh;
            background-color: aquamarine;
            border-radius: 0px 0px 10% 0px;
            position: absolute;
            z-index: -1;
        }
        .main1{
            width: 100%;
            height: 100vh;
            background-color: rgb(0, 255, 170);
            border-radius: 0px 0px 190% 0px;
        }
        .imge{
            width: 25%;
            height: 50vh;
            border-radius: 50%;
        }
        .imge img{
            width: 100%;
            height: inherit;
            border-radius: 50%;
        }
        .cad{
            width: 25%;
            height: 50vh;
            border-radius: 50%;
            background-color: steelblue;
        }
    </style>
</head>
<body>
    <div class="main"></div>
    <div class="main1"></div>
    <div class="imge">
        <img src="../img/anjum.jpeg" alt="">
    </div>
    <div class="cad"></div>
</body>
</html>
