<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            width: 100%;
            height: 70vh;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-radius: 12px;
        }
        .sub{
            width: 23%;
            height: 60vh;
            border: 1px solid black;

        }
        @media (max-width:990px) {
            .main{
                flex-direction: column;
                height: inherit;
                width: 47%;
            }
            .mains{
                display: flex;
                /* flex-direction: column; */
                justify-content: space-around;
                align-items: center;
            }
            .sub{
                width: 100%;
                height: 30vh;
                margin-top: 20px;
            }
        }
        @media (max-width:600px) {
            .mains{
                flex-direction: column;
            }
            .main{
                width: 100%;
                height: inherit;
            }
        }
    </style>
</head>
<body>
   <div class="mains">
     <div class="main">
        <div class="sub"></div>
        <div class="sub"></div>
        <div class="sub"></div>
        <div class="sub"></div>
    </div>
     <div class="main">
        <div class="sub"></div>
        <div class="sub"></div>
        <div class="sub"></div>
        <div class="sub"></div>
    </div>
   </div>
</body>
</html>
