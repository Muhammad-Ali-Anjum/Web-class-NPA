<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title> 
    <style>
        .main{
            width: 200px;
            height: 300px;
            background-image: url(../img/536269967_1230722859094706_5694562282301046339_n.jpg);
            background-repeat: no-repeat;
            background-position: center;
            background-size: 100% 100%;
            animation: animate 5s linear ;

        }
        @keyframes animate{
            0%{
                transform: rotate(0deg);
                border-radius: 0px;
            }
            50%{
                transform: rotate(180deg);
                border-radius: 100px;
            }
            100%{
                transform: rotate(360deg);
                border-radius: 0px;
            }
        }
        .randommedia{
            width: 200px;
            height: 300px;
            background-image: url(../img/536269967_1230722859094706_5694562282301046339_n.jpg);
            background-repeat: no-repeat;
            background-position: center;
            background-size: 100% 100%;
            animation: randomanmiation 5s linear infinite;
            position: relative;

        }
        /* @keyframes randomanmiation{
            0%{

            25%{
                transform: rotate(90deg);

            }
            50%{

            }

            }
            100%{
                transform: rotate(360deg);
                border-radius: 0px;
            }
        } */
@keyframes randomanmiation{
    0%{
        top: 0px;
        left: 0px;
    }
    25%{
        top: 0px;
        left: 200px;
    }
    50%{
        top: 300px;
        left: 200px;
    }
    75%{
        top: 300px;
        left: 0px;
    }
    100%{
        top: 0px;
        left: 0px;
    }

}
.mn{
    width: 400px;
    height: 600px;
    border: 1px solid black;
}
    </style>
</head>

<body>
<div class="main"></div>
<div class="mn">
    <div class="randommedia"></div>
</div>
</body>
</html>
