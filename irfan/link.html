<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a{
            text-decoration: none;
            color: black;
            font-size: 20px;
            margin: 10px;
        }
        /* link */
        a:hover{
            color: red;
        }
        a:active{
            color: green;
        }
        a:visited{
            color: blue;
        }
        a:focus{
            color: yellow;
        }
        a:link{
            color: orange;
        }
    </style>

</head>
<body>
    
    <a href="https://www.google.com" target="_blank">Visit Google</a>

    <a href="./index.html">Visit Index</a>

</html>
