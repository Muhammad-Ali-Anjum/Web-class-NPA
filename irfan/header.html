<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPA</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        header{
            background-color: #333;
            color: #fff;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1{
            font-size: 24px;
            width: 20%;
        }
        .navlinks{
            width: 20%;
        }
        .navlinks ul{
            list-style: none;
            display: flex;
            justify-content: space-between;
            
        }
        .navlinks ul li a{
            text-decoration: none;
            color: #fff;
            font-size: 18px;
        }
        .btn{
            width: 20%;
        }
        header .btn button{
            background-color: #fff;
            color: #333;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            width: 50%;
            border-radius: 5px;
            
        }
    </style>
</head>
<body>
     <header>
        <h1>My Website</h1>
        <nav class="navlinks">
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
        <div class="btn"><button>Apply</button></div>
    </header>
</body>
</html>
